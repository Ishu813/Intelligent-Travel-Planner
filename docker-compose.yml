services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trip_planner
    volumes:
      - trip_planner_pg:/var/lib/postgresql/data

volumes:
  trip_planner_pg:

