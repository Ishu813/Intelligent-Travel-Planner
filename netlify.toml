# Next.js app in web/ — env vars (GEMINI_API_KEY, NEXTAUTH_*, etc.) must be set in Netlify UI.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Planner routes call Gemini. Their route handlers request Netlify's 60-second
# synchronous function duration (see maxDuration in the API route files).
